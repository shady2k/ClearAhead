<!doctype html>
<meta charset="utf-8">
<title>ClearAhead · эскиз B0 · SVG</title>
<style>
  :root {
    --bg: #16181a;
    --panel: #1d2023;
    --line: #2c3135;
    --text: #cfd3d6;
    --muted: #7b8288;
    --warn: #d9a13a;
    --bad: #d9503a;
    --ok: #56a86b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .04em; }
  header .muted { color: var(--muted); }
  #clock { margin-left: auto; font-size: 20px; font-variant-numeric: tabular-nums; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    padding: 3px 10px; font: inherit; cursor: pointer; border-radius: 3px;
  }
  button.on { border-color: var(--ok); color: var(--ok); }
  main { display: flex; gap: 0; align-items: stretch; }
  #scheme { flex: 1 1 auto; min-width: 0; }
  svg { display: block; width: 100%; height: auto; }
  aside {
    flex: 0 0 420px; border-left: 1px solid var(--line);
    padding: 10px 12px; max-height: calc(100vh - 44px); overflow: auto;
  }
  aside h2 { font-size: 11px; letter-spacing: .1em; color: var(--muted);
             text-transform: uppercase; margin: 0 0 8px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500;
       padding: 0 6px 5px 0; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px 5px 0; border-bottom: 1px solid #222629;
       font-variant-numeric: tabular-nums; vertical-align: top; }
  td.num { text-align: right; }
  .bad { color: var(--bad); } .warn { color: var(--warn); } .ok { color: var(--ok); }
  .muted { color: var(--muted); }
  footer { padding: 8px 16px; color: var(--muted); font-size: 11px;
           border-top: 1px solid var(--line); }
</style>

<header>
  <h1>ClearAhead</h1>
  <span class="muted">эскиз B0 · SVG + DOM · станция Приречная</span>
  <button id="pause">пауза</button>
  <button id="x1" class="on">×15</button>
  <button id="x4">×60</button>
  <span id="clock">08:35:00</span>
</header>

<main>
  <div id="scheme"></div>
  <aside>
    <h2>Задания и ресурсы</h2>
    <table>
      <thead><tr>
        <th>#</th><th>Что</th><th>Ресурс</th><th class="num">Срок</th>
        <th class="num">Запас</th><th>Состояние</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </aside>
</main>

<footer id="note"></footer>

<script>
"use strict";

// ── геометрия: координаты набиты руками ────────────────────────────────────
const Y1 = 200, Y2 = 252, Y3 = 304, Y4 = 356, YT = 444, YS = 512;

const TRACKS = [
  { id: "1", label: "1", pts: [[90, Y1], [1780, Y1]] },
  { id: "2", label: "2", pts: [[300, Y1], [470, Y2], [1420, Y2], [1590, Y1]] },
  { id: "3", label: "3", pts: [[480, Y2], [650, Y3], [1250, Y3], [1420, Y2]] },
  { id: "4", label: "4", pts: [[660, Y3], [830, Y4], [1080, Y4], [1250, Y3]] },
  { id: "T", label: "тупик отстоя", pts: [[860, Y4], [620, YT], [400, YT]] },
  { id: "P", label: "подъездной путь", pts: [[1050, Y4], [1480, YS], [1740, YS]] },
];

// маршруты — это те же координаты, пройденные насквозь
const ROUTE_A = [[90, Y1], [300, Y1], [470, Y2], [1420, Y2], [1590, Y1], [1780, Y1]];
const ROUTE_B = [[400, YT], [620, YT], [860, Y4], [1050, Y4], [1480, YS], [1740, YS]];

const SIGNALS = [
  { x: 150, y: Y1 - 20, id: "Ч" },
  { x: 1480, y: Y2 - 20, id: "Н2" },
  { x: 800, y: YT - 20, id: "М3" },
  { x: 1150, y: YS - 20, id: "М7" },
];

// ── скругление ломаной: углы превращаются в стрелочные кривые ──────────────
function round(pts, r = 46, steps = 14) {
  const out = [pts[0].slice()];
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i - 1], v = pts[i], n = pts[i + 1];
    const d1 = Math.hypot(v[0] - p[0], v[1] - p[1]);
    const d2 = Math.hypot(n[0] - v[0], n[1] - v[1]);
    const rr = Math.min(r, d1 / 2, d2 / 2);
    const u1 = [(v[0] - p[0]) / d1, (v[1] - p[1]) / d1];
    const u2 = [(n[0] - v[0]) / d2, (n[1] - v[1]) / d2];
    const a = [v[0] - u1[0] * rr, v[1] - u1[1] * rr];
    const b = [v[0] + u2[0] * rr, v[1] + u2[1] * rr];
    for (let k = 0; k <= steps; k++) {
      const t = k / steps, m = 1 - t;
      out.push([m * m * a[0] + 2 * m * t * v[0] + t * t * b[0],
                m * m * a[1] + 2 * m * t * v[1] + t * t * b[1]]);
    }
  }
  out.push(pts[pts.length - 1].slice());
  return out;
}

const d = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");

// ── интерполяция вдоль ломаной ─────────────────────────────────────────────
function measure(pts) {
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}

function at(poly, s) {
  const { pts, cum, len } = poly;
  s = Math.max(0, Math.min(len, s));
  let i = 1;
  while (i < cum.length - 1 && cum[i] < s) i++;
  const t = (s - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
  const a = pts[i - 1], b = pts[i];
  return {
    x: a[0] + (b[0] - a[0]) * t,
    y: a[1] + (b[1] - a[1]) * t,
    ang: Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI,
  };
}

// ── отрисовка ──────────────────────────────────────────────────────────────
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, text) => {
  const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]);
  if (text !== undefined) e.textContent = text;
  return e;
};

const svg = el("svg", { viewBox: "0 0 1800 600" });
document.getElementById("scheme").append(svg);

const geom = TRACKS.map(t => ({ ...t, poly: measure(round(t.pts)) }));

// слои: балласт → шпалы → рельсы → вырез. Рельс получается из двух обводок.
const layers = {
  ballast: el("g", { fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }),
  sleeper: el("g", { fill: "none", "stroke-linecap": "butt", "stroke-dasharray": "2.5 7" }),
  railOut: el("g", { fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }),
  railIn:  el("g", { fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }),
  marks:   el("g", {}),
  cars:    el("g", {}),
};
Object.values(layers).forEach(g => svg.append(g));

const ballastOf = {};   // id → элемент балласта, чтобы красить занятость
for (const t of geom) {
  const path = d(t.poly.pts);
  const b = el("path", { d: path, stroke: "#3a3733", "stroke-width": 26 });
  ballastOf[t.id] = b;
  layers.ballast.append(b);
  layers.sleeper.append(el("path", { d: path, stroke: "#4c473f", "stroke-width": 21 }));
  layers.railOut.append(el("path", { d: path, stroke: "#c9c4b6", "stroke-width": 9 }));
  layers.railIn.append(el("path", { d: path, stroke: "#3a3733", "stroke-width": 5.5 }));
}

// упоры в тупиках
for (const [x, y, dir] of [[400, YT, -1], [1740, YS, 1]]) {
  layers.marks.append(el("line", {
    x1: x + dir * 4, y1: y - 13, x2: x + dir * 4, y2: y + 13,
    stroke: "#c9c4b6", "stroke-width": 4,
  }));
}

// предприятие
layers.marks.append(el("rect", { x: 1570, y: YS + 28, width: 170, height: 42,
  fill: "#24282b", stroke: "#3a4044" }));
layers.marks.append(el("text", { x: 1655, y: YS + 54, fill: "#8d949a",
  "font-size": 13, "text-anchor": "middle", "font-family": "monospace" }, "предприятие"));

// номера путей и подписи
const labelAt = { "1": [110, Y1], "2": [490, Y2], "3": [670, Y3], "4": [850, Y4] };
for (const id in labelAt) {
  const [x, y] = labelAt[id];
  layers.marks.append(el("text", { x, y: y - 20, fill: "#8d949a", "font-size": 14,
    "font-family": "monospace" }, id + " путь"));
}
for (const [x, y, s] of [[420, YT + 32, "тупик отстоя"], [1200, YS + 26, "подъездной путь"]]) {
  layers.marks.append(el("text", { x, y, fill: "#6f767c", "font-size": 13,
    "font-family": "monospace" }, s));
}

// сигналы
const sigDots = SIGNALS.map(s => {
  const g = el("g", {});
  g.append(el("line", { x1: s.x, y1: s.y, x2: s.x, y2: s.y + 13,
    stroke: "#6f767c", "stroke-width": 2 }));
  const dot = el("circle", { cx: s.x, cy: s.y, r: 5, fill: "#d9503a" });
  g.append(dot);
  g.append(el("text", { x: s.x + 9, y: s.y + 4, fill: "#6f767c", "font-size": 11,
    "font-family": "monospace" }, s.id));
  layers.marks.append(g);
  return dot;
});

// ── составы ────────────────────────────────────────────────────────────────
const polyA = measure(round(ROUTE_A));
const polyB = measure(round(ROUTE_B));

function consist(n, locoFirst) {
  const cars = [];
  for (let i = 0; i < n; i++) {
    const isLoco = locoFirst && i === 0;
    const w = isLoco ? 30 : 26, h = 15;
    const r = el("rect", {
      x: -w / 2, y: -h / 2, width: w, height: h, rx: 2.5,
      fill: isLoco ? "#d9a13a" : "#79848d",
      stroke: isLoco ? "#8a6520" : "#4e565c",
    });
    const g = el("g", {});
    g.append(r);
    layers.cars.append(g);
    cars.push({ g, off: i * 32 });
  }
  return cars;
}

const trainA = consist(4, true);   // пригородный
const trainB = consist(9, true);   // локомотив + 8 полувагонов

function place(cars, poly, head) {
  for (const c of cars) {
    const s = head - c.off;
    if (s < 0 || s > poly.len) { c.g.setAttribute("opacity", 0); continue; }
    c.g.setAttribute("opacity", 1);
    const p = at(poly, s);
    c.g.setAttribute("transform",
      `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.ang.toFixed(1)})`);
  }
}

// ── модельное время и движение ─────────────────────────────────────────────
const T0 = 8 * 3600 + 35 * 60;   // 08:35:00
const CYCLE = 900;               // 15 модельных минут, потом повтор
let model = 0, rate = 15, running = true, last = performance.now();

function leg(t, legs) {           // кусочно-линейное движение
  for (const L of legs) {
    if (t < L.t0) return L.s0;
    if (t <= L.t1) return L.s0 + (L.s1 - L.s0) * (t - L.t0) / (L.t1 - L.t0);
  }
  return legs[legs.length - 1].s1;
}

const stopA = polyA.len * 0.62;
const legsA = [
  { t0: 30,  t1: 240, s0: 0,     s1: stopA },
  { t0: 240, t1: 360, s0: stopA, s1: stopA },          // стоянка 2 мин
  { t0: 360, t1: 560, s0: stopA, s1: polyA.len + 200 },
];
const legsB = [
  { t0: 0,   t1: 90,  s0: 300, s1: 300 },
  { t0: 90,  t1: 400, s0: 300, s1: polyB.len },        // подача на предприятие
  { t0: 400, t1: 560, s0: polyB.len, s1: polyB.len },  // расстановка
  { t0: 560, t1: 860, s0: polyB.len, s1: 300 },        // уборка
];

const fmt = s => {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") +
         ":" + String(s % 60).padStart(2, "0");
};
const mmss = s => {
  const neg = s < 0; s = Math.abs(Math.round(s));
  return (neg ? "−" : "+") + String(Math.floor(s / 60)).padStart(2, "0") +
         ":" + String(s % 60).padStart(2, "0");
};

// ── таблица заданий ────────────────────────────────────────────────────────
const JOBS = [
  { n: 1, what: "Подача 8 полувагонов",  res: "лок. ЧМЭ3-401, 4 путь, подъездной", due: 90,  t0: 90,  t1: 400 },
  { n: 2, what: "Расстановка у фронта",  res: "подъездной путь",                   due: 560, t0: 400, t1: 560 },
  { n: 3, what: "Уборка порожних",       res: "лок. ЧМЭ3-401, 4 путь",             due: 900, t0: 560, t1: 860 },
  { n: 4, what: "Приём пригородного",    res: "1 путь, зап. горловина, 2 путь",    due: 250, t0: 30,  t1: 240 },
  { n: 5, what: "Стоянка 2 мин",         res: "2 путь",                            due: 365, t0: 240, t1: 360 },
  { n: 6, what: "Отправление 6412",      res: "2 путь, вост. горловина",           due: 545, t0: 360, t1: 560 },
  { n: 7, what: "Формирование грузового", res: "3 путь, вытяжка",                  due: 780, t0: 600, t1: 800 },
  { n: 8, what: "Отправление грузового", res: "вост. горловина, 1 путь",           due: 880, t0: 800, t1: 900 },
];

const rows = document.getElementById("rows");
const cells = JOBS.map(j => {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="muted">${j.n}</td><td>${j.what}</td>` +
                 `<td class="muted">${j.res}</td>` +
                 `<td class="num">${fmt(T0 + j.due).slice(0, 5)}</td>` +
                 `<td class="num"></td><td></td>`;
  rows.append(tr);
  return { slack: tr.children[4], state: tr.children[5] };
});

function updateTable(t) {
  JOBS.forEach((j, i) => {
    const c = cells[i];
    let state, cls = "";
    if (t < j.t0)       { state = "ожидает"; cls = "muted"; }
    else if (t < j.t1)  { state = "выполняется"; }
    else                { state = "выполнено"; cls = "ok"; }
    const done = t >= j.t1;
    const slack = done ? j.due - j.t1 : j.due - Math.max(t, j.t1);
    c.slack.textContent = mmss(slack);
    c.slack.className = "num " + (slack < 0 ? "bad" : slack < 120 ? "warn" : "");
    c.state.textContent = state;
    c.state.className = cls;
  });
}

// ── занятость: перекраска балласта ─────────────────────────────────────────
function updateOccupancy(t) {
  const free = "#3a3733", route = "#2f4433", busy = "#4d2d27";
  const set = (id, c) => ballastOf[id].setAttribute("stroke", c);
  set("1", t > 10 && t < 60 ? route : t > 500 && t < 570 ? route : free);
  set("2", t > 55 && t < 560 ? busy : free);
  set("4", (t > 60 && t < 200) || (t > 560 && t < 860) ? busy : free);
  set("T", t < 120 || t > 820 ? busy : free);
  set("P", t > 200 ? busy : free);
  set("3", t > 600 && t < 900 ? busy : free);
  sigDots[0].setAttribute("fill", t > 10 && t < 60 ? "#56a86b" : "#d9503a");
  sigDots[1].setAttribute("fill", t > 340 && t < 400 ? "#56a86b" : "#d9503a");
  sigDots[2].setAttribute("fill", t > 80 && t < 130 ? "#d9a13a" : "#7b2f24");
  sigDots[3].setAttribute("fill", t > 150 && t < 420 ? "#d9a13a" : "#7b2f24");
}

// ── цикл ───────────────────────────────────────────────────────────────────
const clock = document.getElementById("clock");

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (running) model = (model + dt * rate) % CYCLE;

  clock.textContent = fmt(T0 + model);
  place(trainA, polyA, leg(model, legsA));
  place(trainB, polyB, leg(model, legsB));
  updateTable(model);
  updateOccupancy(model);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── управление ─────────────────────────────────────────────────────────────
const bPause = document.getElementById("pause");
const b1 = document.getElementById("x1"), b4 = document.getElementById("x4");
bPause.onclick = () => { running = !running; bPause.textContent = running ? "пауза" : "пуск"; };
b1.onclick = () => { rate = 15; b1.classList.add("on"); b4.classList.remove("on"); };
b4.onclick = () => { rate = 60; b4.classList.add("on"); b1.classList.remove("on"); };

document.getElementById("note").textContent =
  "Один файл, ни сборки, ни зависимостей. Рельс — две обводки одной ломаной. " +
  "Состав — прямоугольники, каждый со своим смещением вдоль маршрута: поворот на кривой получается сам.";
</script>
